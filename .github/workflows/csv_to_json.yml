name: DLS CSV to JSON Auto Converter

on:
  push:
    paths:
      - '**.csv'
      - 'data/**.csv'
  workflow_dispatch: # 깃허브 웹 화면에서 수동 실행 버튼 제공

jobs:
  convert-csv:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: CSV ➔ JSON 변환 스크립트 실행
        run: python scripts/convert_csv.py

      - name: 변환된 json 파일 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dls_books.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Auto] DLS CSV ➔ dls_books.json 자동 변환 업데이트" && git push)
